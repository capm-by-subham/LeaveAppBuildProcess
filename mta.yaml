_schema-version: 3.3.0
ID: leave
description: A simple CAP project.
version: 1.0.0
modules:
  - name: leave-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: leave-auth
      - name: leave-db
      - name: leave-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: leave-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: leave-db
    parameters:
      buildpack: nodejs_buildpack
  - name: leave
    type: approuter.nodejs
    path: .deploy/app-router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: leave-auth
      - name: leave-destination
      - name: leave-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: leave-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: leave-auth
      - name: srv-api
      - name: leave-html5-repo-host
        parameters:
          config:
            HTML5Runtime_enabled: true
          content-target: true
    parameters:
      config:
        destinations:
          - Authentication: NoAuthentication
            DynamicDestination: true
            ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
            forwardAuthToken: true
            name: srv-api
            url: ~{srv-api/srv-url}
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - leave_approval.zip
          name: leaveleave_approval
          target-path: app/
        - artifacts:
            - leaveapplication.zip
          name: leaveapplication
          target-path: app/
  - name: leaveleave_approval
    type: html5
    path: app/leave_approval
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - npm ci
        - npm run build
      supported-platforms: []
  - name: leave-destinations
    type: com.sap.application.content
    requires:
      - name: leave-auth
        parameters:
          service-key:
            name: leave-auth-key
      - name: leave-html5-repo-host
        parameters:
          service-key:
            name: leave-html5-repo-host-key
      - name: srv-api
      - name: leave-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: leave-html5-repository
              ServiceInstanceName: leave-html5-repo-host
              ServiceKeyName: leave-html5-repo-host-key
              sap.cloud.service: leave.service
            - Authentication: OAuth2UserTokenExchange
              Name: leave-auth
              ServiceInstanceName: leave-auth
              ServiceKeyName: leave-auth-key
              sap.cloud.service: leave.service
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: leaveapplication
    type: html5
    path: app/leave_application
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: leaveleave_application
    type: html5
    path: app/leave_application
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
resources:
  - name: leave-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: leave-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api
  - name: leave-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: leave-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
  - name: leave-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: leave-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
